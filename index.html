<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scanner QR E-KONFERENSI</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>body{font-family:Arial,sans-serif;max-width:680px;margin:20px auto;padding:16px;background:#f3f7f4;color:#173b2c}.card{background:white;border-radius:14px;padding:18px;box-shadow:0 3px 14px #0001}h1{font-size:22px}.row{display:flex;gap:8px;flex-wrap:wrap}button,select{padding:11px 14px;border-radius:8px;border:1px solid #ccc;font-size:15px}button{background:#087443;color:white;border:0;cursor:pointer}.secondary{background:#555}.status{padding:12px;margin-top:12px;border-radius:8px;background:#edf5ef;white-space:pre-wrap}#reader{width:100%;margin-top:14px}small{color:#555}</style></head>
<body><div class="card"><h1>Scanner QR — E-KONFERENSI PCNU Sragen</h1><p>Halaman scanner mandiri. Gunakan hanya melalui HTTPS dan dari tautan yang diberikan admin.</p><div class="row"><label>Mode <select id="mode"><option value="MASUK">MASUK RUANGAN</option><option value="KELUAR">KELUAR RUANGAN</option></select></label><button id="start">Aktifkan Kamera</button><button class="secondary" id="stop">Matikan Kamera</button></div><div id="reader"></div><div id="status" class="status">Siap. Tekan Aktifkan Kamera.</div><p><small>Token admin hanya digunakan untuk meneruskan scan ke backend E-KONFERENSI.</small></p></div>
<script>
const params=new URLSearchParams(location.search); const backend=params.get('backend')||''; const token=decodeURIComponent(location.hash.slice(1)); let scanner=null,busy=false,lastText=''; const statusEl=document.getElementById('status');
function status(t){statusEl.textContent=t}
function callBackend(qr,aksi){return new Promise((resolve,reject)=>{const cb='ekScanCb'+Date.now()+Math.floor(Math.random()*10000);const s=document.createElement('script');const timer=setTimeout(()=>{cleanup();reject(new Error('Server tidak merespons. Periksa URL backend dan deployment.'))},20000);function cleanup(){clearTimeout(timer);delete window[cb];s.remove()}window[cb]=r=>{cleanup();resolve(r)};s.onerror=()=>{cleanup();reject(new Error('Tidak dapat menghubungi backend E-KONFERENSI.'))};s.src=backend+'?api=scan&callback='+cb+'&token='+encodeURIComponent(token)+'&qr='+encodeURIComponent(qr)+'&aksi='+encodeURIComponent(aksi)+'&_='+Date.now();document.body.appendChild(s)})}
async function onScan(decoded){if(busy||decoded===lastText)return;busy=true;lastText=decoded;status('Memproses QR ke server…');try{const r=await callBackend(decoded,document.getElementById('mode').value);status((r&&r.message)||'Server tidak memberikan hasil.');if(r&&r.participant){status((r.message||'')+'\nNama: '+(r.participant.nama||'-')+'\nWilayah: '+(r.participant.wilayah||'-'))}}catch(e){status('Gagal mencatat: '+e.message)}finally{setTimeout(()=>{busy=false;lastText=''},1800)}}
document.getElementById('start').onclick=async()=>{if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia){status('Browser tidak mengizinkan kamera. Pastikan halaman dibuka melalui HTTPS.');return}if(!backend||!token){status('Tautan scanner belum lengkap. Buka dari tombol/tautan admin E-KONFERENSI.');return}try{if(scanner){try{await scanner.stop()}catch(e){}}scanner=new Html5Qrcode('reader');await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:240,height:240}},onScan,()=>{});status('Kamera aktif. Arahkan QR peserta ke kamera.')}catch(e){status('Gagal membuka kamera: '+(e.name||'Error')+' — '+e.message)}};
document.getElementById('stop').onclick=async()=>{if(scanner){try{await scanner.stop();await scanner.clear()}catch(e){}scanner=null}status('Kamera dimatikan.')};
</script></body></html>
